name: Monitor Releases

on:
  schedule:
    - cron: "23 4 * * *" # Daily at 4:23 AM UTC
  workflow_dispatch: # Allow manual trigger

concurrency:
  group: monitor-releases

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      # The default GITHUB_TOKEN cannot create or approve pull requests
      # (a separate repo-level restriction) - generate a token from the
      # existing GitHub App instead, matching the established pattern in
      # other repos, scoped to only what this workflow actually needs.
      - name: Generate Token
        id: generate_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          token: ${{ steps.generate_token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.14.1"
          cache: "npm"

      - name: Install Dependencies
        run: npm install

      - name: Run Monitor Script
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token || secrets.GITHUB_TOKEN }}
        run: npx tsx scripts/monitor-releases.ts

      - name: Check for changes
        id: diff
        run: |
          if git diff --exit-code verified-versions.json; then
            echo "updated=false" >> $GITHUB_OUTPUT
          else
            echo "updated=true" >> $GITHUB_OUTPUT
          fi

      # main requires all changes via PR (zero approvals needed, but no
      # direct push allowed even for bots) - open a PR from a reused branch
      # and merge it immediately ourselves rather than pushing directly.
      - name: Open PR with registry updates
        if: steps.diff.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        id: cpr
        with:
          token: ${{ steps.generate_token.outputs.token || secrets.GITHUB_TOKEN }}
          commit-message: "chore(registry): update pending verification matrix"
          title: "chore(registry): update pending verification matrix"
          body: "Automated update from the Monitor Releases workflow."
          branch: monitor-releases-updates
          delete-branch: true
          sign-commits: true

      - name: Merge the registry-update PR
        id: commit
        # Not gated on pull-request-operation == 'created' - an open PR left
        # over from a prior failed run (e.g. this same merge step erroring
        # out) would come back as 'updated' on the reused branch, and should
        # still be merged now rather than silently left open again.
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge --auto --squash "${{ steps.cpr.outputs.pull-request-number }}" ||
            gh pr merge --squash "${{ steps.cpr.outputs.pull-request-number }}"
          echo "updated=true" >> $GITHUB_OUTPUT

      - name: Create Issues for Pending
        if: steps.commit.outputs.updated == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const registry = JSON.parse(fs.readFileSync('verified-versions.json', 'utf8'));
            const pending = registry.filter(e => e.status === 'pending');

            // Get all open issues with the label to avoid duplicates
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'verification-required'
            });

            for (const entry of pending) {
                const title = `Verification Required: FVTT ${entry.fvtt} + ${entry.system} v${entry.systemVersion}`;
                
                if (!issues.some(i => i.title === title)) {
                  console.log(`Creating issue: ${title}`);
                  await github.rest.issues.create({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    title: title,
                    body: `A new compatibility stack has been added to the pending list.\n\n**FVTT:** ${entry.fvtt}\n**System:** ${entry.system} v${entry.systemVersion}\n\n${entry.notes}`,
                    labels: ['verification-required']
                  });
                  issues.push({ title });
                } else {
                  console.log(`Issue already exists: ${title}`);
                }
            }
