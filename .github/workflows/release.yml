name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release

jobs:
  release:
    runs-on: ubuntu-latest
    # Renovate-authored commits (and this workflow's own version-bump PRs,
    # before they're detected as the release commit below) carry this
    # suffix specifically so they don't re-enter this pipeline.
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[no-release]')
    permissions:
      contents: write
      pull-requests: write
    steps:
      # The default GITHUB_TOKEN cannot create/merge pull requests and is
      # excluded from triggering other workflows (needed so the tag push in
      # the release-commit phase below actually fires publish.yml) - use the
      # existing GitHub App token instead, same as monitor-releases.yml.
      #
      # Deliberately not requesting permission-issues here: the installation
      # doesn't have Issues granted, and requesting an ungranted permission
      # fails the whole token mint. Labels still work below because the
      # "release" label already exists in the repo and attaching an existing
      # label to a PR you're creating doesn't need that scope (verified
      # against n8n-nodes-actual's identical, currently-working workflow).
      - name: Generate Token
        id: generate_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0 # conventional-changelog needs full history since the last tag
          persist-credentials: false
          token: ${{ steps.generate_token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      # main's ruleset forces every change through a squash-merged PR, so the
      # commit that lands here is never the one release-it originally made -
      # detect via the PR's label rather than string-matching the message.
      - name: Detect release commit
        id: detect
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          IS_RELEASE=$(gh api "repos/${{ github.repository }}/commits/$(git rev-parse HEAD)/pulls" \
            --jq '[.[] | select(.labels[].name == "release")] | length > 0')
          echo "is_release_commit=$IS_RELEASE" >> "$GITHUB_OUTPUT"

      # --- Not a release commit: see if there's anything to release ---

      - name: Check for releasable commits
        id: check
        if: steps.detect.outputs.is_release_commit == 'false'
        run: |
          NEXT=$(npx release-it --release-version --ci || true)
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Bump version and changelog
        if: steps.detect.outputs.is_release_commit == 'false' && steps.check.outputs.next != ''
        # Commit/tag/push/GitHub-release are all deferred: tagging has to
        # happen against the real post-squash-merge commit, not this one.
        run: npx release-it --ci --no-git.commit --no-git.tag --no-git.push --no-github.release

      - name: Open version-bump PR
        if: steps.detect.outputs.is_release_commit == 'false' && steps.check.outputs.next != ''
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token || secrets.GITHUB_TOKEN }}
          NEXT: ${{ steps.check.outputs.next }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          BRANCH="release/v$NEXT"
          git checkout -b "$BRANCH"
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore(release): v$NEXT"

          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push "$REMOTE" "$BRANCH"

          gh label create release --color 0e8a16 --description "Automated release PR" 2>/dev/null || true

          gh pr create --title "chore(release): v$NEXT" \
            --body "Automated version bump from the Release workflow." \
            --base main --head "$BRANCH" --label release

          gh pr merge --auto --squash "$BRANCH" ||
            gh pr merge --squash "$BRANCH"

      # --- Is a release commit: tag the real merge commit and publish ---

      - name: Tag and create GitHub release
        if: steps.detect.outputs.is_release_commit == 'true'
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "Tag v$VERSION already exists, skipping."
            exit 0
          fi
          # Created via the API (not `git push`) with the App token, not the
          # default GITHUB_TOKEN, so it actually fires publish.yml's tag trigger.
          gh api "repos/${{ github.repository }}/git/refs" \
            -f ref="refs/tags/v$VERSION" \
            -f sha="$(git rev-parse HEAD)"
          gh release create "v$VERSION" --title "v$VERSION" --generate-notes
